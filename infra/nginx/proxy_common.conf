proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_http_version 1.1;

# $connection_upgrade is defined by the map in the site config. It sends
# "Connection: upgrade" ONLY for a real websocket handshake and "close"
# otherwise. The previous unconditional `Connection "upgrade"` was sent on every
# ordinary JSON request with an empty Upgrade header, which is malformed and
# breaks keepalive to the API.
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
