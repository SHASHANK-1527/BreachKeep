# BreachKeep reverse proxy.
# Core rule: without the bk_gate cookie, only the PUBLIC landing bundle and public
# API endpoints are reachable. The gated app bundle is never served pre-gate, so
# inner routes can't be discovered by editing the URL or reading the JS.

# Websocket upgrades (the labs terminal) need Connection: upgrade; ordinary API
# requests must NOT get it. proxy_common.conf reads this.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

map $cookie_bk_gate $has_gate { default 0; "~.+" 1; }

server {
  listen 80;
  server_name _;

  # public API (no gate needed): access-code check + daily-code resend
  location = /api/auth/verify-access-code { proxy_pass http://api:5000; include /etc/nginx/proxy_common.conf; }
  location = /api/access/resend-daily     { proxy_pass http://api:5000; include /etc/nginx/proxy_common.conf; }
  location = /api/health                  { proxy_pass http://api:5000; include /etc/nginx/proxy_common.conf; }
  # kill-switch status, polled by both bundles so they can show the maintenance page
  location = /api/status                  { proxy_pass http://api:5000; include /etc/nginx/proxy_common.conf; }

  # all other API -> api service (its own middleware 404s if unauthenticated)
  location /api/  { proxy_pass http://api:5000; include /etc/nginx/proxy_common.conf; }

  # per-session challenge URLs -> provisioner (which proxies to the student's ttyd)
  # Per-student terminal (ttyd over WebSocket). Long timeouts so an idle
  # shell is not cut off; auth is the per-session token the provisioner checks.
  location /labs/ {
    proxy_pass http://provisioner:6000;
    include /etc/nginx/proxy_common.conf;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # Per-student web-app target (the Trading Post) for the web dungeon.
  location /app/ {
    proxy_pass http://provisioner:6000;
    include /etc/nginx/proxy_common.conf;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # static bundles. With a gate cookie, serve the app; otherwise the landing.
  root /usr/share/nginx/html/landing;

  # Browsers ask for /favicon.ico on their own. Without this it falls through the
  # gate rewrite into /app/ and hits the provisioner, which answers 403 JSON.
  location = /favicon.ico {
    root /usr/share/nginx/html/landing;
    try_files /favicon.svg =204;
    access_log off;
    expires 1d;
  }

  location / {
    if ($has_gate) { rewrite ^ /app$uri last; }
    try_files $uri /landing.html;
  }

  location /app {
    alias /usr/share/nginx/html/app;
    try_files $uri /app/index.html;
  }
}
